<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseColors {
        0% { fill: #FF5733; }   /* Oranžová */
        25% { fill: #33FF57; }  /* Zelená */
        50% { fill: #3357FF; }  /* Modrá */
        75% { fill: #F333FF; }  /* Fialová */
        100% { fill: #FF5733; } /* Zpět na oranžovou */
      }
      .animated-text {
        font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 48px;
        font-weight: bold;
        animation: pulseColors 8s infinite ease-in-out;
        text-anchor: middle;
      }
    </style>
  </defs>
  
  <text x="250" y="85" class="animated-text">IRblaster</text>
</svg>
